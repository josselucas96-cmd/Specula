# Public corrections & mistake log — rendered on /Methodology.
# One [[entry]] per correction, newest first. Never delete an entry.
# Fields: date, scope, title, what (what was wrong), fix (what was done),
#         impact (what changed in published figures), status.

[[entry]]
date   = "2026-09-25"
scope  = "All portfolios"
title  = "No ledger rows written on 23 and 24 September"
what   = "The safeguard added on 23 September, which refuses to write a trading day whose closing prices are not yet published, stopped the whole nightly job instead of skipping only that day. The job starts around 00:20 UTC and the data provider was publishing later than that, so the job stopped every night before filling the previous days, while reporting success. The site showed data as of 22 September for two days. The morning check flagged the missing rows on 23 and 24 September."
fix    = "An unpublished day is now skipped on its own and earlier days are still filled and checked. A second daily pass at 09:30 UTC writes the previous day once its closes are out. The rows for 23 and 24 September were written on 25 September from their own closing prices. Covered by regression tests."
impact = "No figure was wrong; the site was two days behind. Moves executed on 23 September appear from that date as intended."
status = "closed"

[[entry]]
date   = "2026-09-23"
scope  = "All portfolios"
title  = "Ledger a full session behind on 21 and 22 September"
what   = "The data provider published its daily closing bars several hours later than usual (intraday prices were available, the daily bar was not). The nightly job, which GitHub had drifted to just after midnight UTC, found no close for its target day and carried the previous session forward — the behaviour that is correct for a weekend, wrong for a trading day. The row dated 21 September carries the closes of 18 September, and the row dated 22 September carries those of 21 September. Figures shown on 22 and 23 September are correct for one session earlier, and understate the portfolios by roughly 3-4%."
fix    = "The job now tells the two cases apart: a weekday whose close is not yet published leaves the day unwritten (a visible gap) instead of stamping stale prices on a real session. Filling holes was not enough either — a row written wrong exists, so nothing ever re-read it — so each run now also re-prices the last three sessions against their own closes and rewrites what does not match. The morning watchdog performs the same check independently and fails the run if it finds a mismatch. The 21 September row was rebuilt with its own closes on 23 September and the 22 September row on 24 September, once the provider had published them."
impact = "No trade, share count or cash balance is affected; only the closing prices of two days. Corrected inception-to-date returns at 21 September: Le Visionnaire +25.10% (shown +20.33%), Le Bâtisseur +1.36% (shown -0.07%), Le Nakamoto +11.74% (shown +5.76%). Sharpe of Le Visionnaire 1.29 -> 1.54; max drawdown unchanged."
status = "closed"

[[entry]]
date   = "2026-09-23"
scope  = "All portfolios"
title  = "Benchmark data swapped between pages loading at the same time"
what   = "The library used to download market prices stores the results of each download in a place shared by the whole application, without protection. When two pages were opened at the same moment, one of them could receive the other's data. On 23 September this produced three wrong benchmarks. In the morning, the Nasdaq 100 on Le Visionnaire was measured from 5 May, which is Le Bâtisseur's start date, instead of 10 April, and the page showed an alpha of +11.31%. In the afternoon, Le Bâtisseur displayed the return of Circle, one of its holdings, as the return of the S&P 500 (-17.64%, alpha +19.00%), and Le Nakamoto displayed the return of one of its holdings as the return of Bitcoin (-29.96%, alpha +41.70%). The flaw had existed since launch but only appears when two pages load simultaneously. It was initially attributed to an incomplete response from the data provider; that diagnosis was wrong."
fix    = "Benchmarks are now fetched with a method that does not use the shared storage, checked under concurrent load. All other downloads run one at a time, and any response that contains a security that was not requested is rejected. A benchmark must also reach back to the portfolio's start date and cover at least 80% of the trading sessions in the period, otherwise the page shows no benchmark and no alpha. Covered by regression tests."
impact = "No portfolio figure was affected: net asset value, returns, drawdown and volatility were correct throughout. Only the displayed benchmark return and alpha were wrong, for part of 23 September. Correct values at 21 September: Le Visionnaire +25.10% against +21.60% for the Nasdaq 100 (alpha +3.50%), Le Bâtisseur +1.36% against +7.41% for the S&P 500 (alpha -6.05%), Le Nakamoto +11.74% against +8.00% for Bitcoin (alpha +3.74%)."
status = "closed"

[[entry]]
date   = "2026-09-21"
scope  = "Le Bâtisseur"
title  = "Two more rows rebuilt with a later book (9 and 11 June)"
what   = "A full reconciliation of every ledger day against the trade log (new as-of reconstruction) found two rows written by a late backfill with the book of the following day: 9 June held CoStar instead of VICI (switch of 10 June), 11 June held the post-reinforcement NOW position (trade of 12 June)."
fix    = "Both rows rewritten with the book of their own day at that day's closes. Backfills now reconstruct the book as of the target date from the trade log and are authoritative for the day (stale positions removed)."
impact = "9 June NAV +0.03%; 11 June NAV −0.84%. No change to month-end returns, inception-to-date return or max drawdown."
status = "closed"

[[entry]]
date   = "2026-09-19"
scope  = "All portfolios"
title  = "Site frozen for 18 days while announcing itself up to date"
what   = "GitHub disables scheduled jobs after 60 days without a commit. The nightly ledger writer stopped on 2026-09-01; the pages kept showing 'Last updated <today>' because that label reflected the price feed, not the ledger. Figures shown 1–19 Sept were correct for 30/31 Aug, not for the day of the visit."
fix    = "Ledger back-filled 31 Aug → 18 Sept from end-of-day closes; 'Last updated' now shows the ledger date; a visible warning appears when data is more than 3 days old; a monthly keep-alive commit and a daily independent watchdog (e-mail on failure) were added."
impact = "No historical figure changed. Live figures were stale for 18 days."
status = "closed"

