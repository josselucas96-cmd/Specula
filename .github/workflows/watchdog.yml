name: Watchdog (pipeline health)

# Independent of the nightly refresh: every morning, verify that yesterday's
# daily_holdings rows exist for every portfolio, that current_prices is fresh,
# that the daily-refresh workflow is still enabled, and that the public app
# answers. Any problem => this run fails => GitHub e-mails the repo owner.
# Background: the Sept 2026 freeze went unnoticed for 18 days.

on:
  schedule:
    - cron: '40 6 * * *'   # 06:40 UTC, after the 22:07 UTC refresh (even if GitHub delays it by hours)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          # pandas + yfinance: check_ledger_is_priced_on_its_own_day. Without
          # them every run crashed from 2026-09-23 to 10-01 and no check ran.
          pip install --quiet "supabase>=2.4.0,<3.0" "yfinance>=0.2.40,<1.0" "pandas>=2.0.0,<3.0"

      - name: Run health checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: https://specula-project.streamlit.app/
        run: python scripts/watchdog.py
