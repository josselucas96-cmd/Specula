name: Keep app awake

# Streamlit Community Cloud sleeps a public app after 12h without traffic and
# then shows visitors a "get this app back up" page with a ~1 min cold start.
# A real headless-browser visit every 2h keeps Specula awake (and wakes it if
# it dozed off). See scripts/keep_awake.py. Public repo => Actions minutes free.

on:
  schedule:
    # Every 2h: GitHub drops about half of the scheduled runs of this repo, and
    # at every 6h that left gaps of 16-18h, past Streamlit's 12h limit.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Page to visit (default: landing page)'
        required: false
        type: string

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app (wake it if asleep) and check the deployed build
        env:
          APP_URL: ${{ inputs.url || 'https://specula-project.streamlit.app/' }}
        run: |
          export RECENT_SHAS="$(git log -n 10 --format=%H | xargs)"
          python scripts/keep_awake.py

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep_awake_failure.png
          if-no-files-found: ignore
